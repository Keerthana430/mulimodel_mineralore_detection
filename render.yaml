services:
  - type: web
    name: orevision-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_RGB_ENDPOINT
        sync: false
      - key: HF_MICROSCOPIC_ENDPOINT
        sync: false
      - key: HF_INFRARED_ENDPOINT
        sync: false
      - key: HF_ACOUSTIC_ENDPOINT
        sync: false
      - key: HF_CAPACITIVE_ENDPOINT
        sync: false
      - key: DATABASE_URL
        sync: false